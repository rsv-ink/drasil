name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: "*"

jobs:
  unit-tests:
    name: Unit Tests - Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3', '3.4']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run unit tests
      run: bundle exec rspec spec/unit --format documentation

  integration-tests:
    name: Integration Tests - Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3', '3.4']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run integration tests
      run: bundle exec rspec spec/integration --format documentation